# Supabase free tier menjeda project yang tidak aktif ~7 hari => kartu mati. Ping rutin mencegahnya.
# Isi GitHub Secrets: SUPABASE_URL dan SUPABASE_ANON_KEY
name: keepalive
on:
  schedule: [{ cron: '0 3 */3 * *' }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/check_card_status" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" -H "Content-Type: application/json" \
            -d '{"p_uid":"PING-0000"}'
