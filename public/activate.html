<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%AD%90%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/style.css">
<title>Aktivasi Kartu</title>
</head>
<body data-page="activate">
<main>
<noscript><p class="msg error">Aktifkan JavaScript untuk melanjutkan.</p></noscript>
<h1>Aktivasi Kartu</h1><p class="sub">Hubungkan kartu ini ke lokasi bisnis Anda di Google Maps.</p>
<div id="loader" class="loader" role="status"><span class="spin"></span><span id="loader-text">Memuat…</span></div>
<form id="form" hidden novalidate autocomplete="off"><fieldset id="fs">
<label for="code">Kode aktivasi (tertera di belakang kartu)</label>
<input id="code" type="text" maxlength="16" autocapitalize="characters" autocomplete="off" spellcheck="false">
<label for="bname">Nama toko (untuk catatan)</label>
<input id="bname" type="text" maxlength="200" autocomplete="off">
<label for="pid">Place ID Google Maps</label>
<input id="pid" type="text" maxlength="400" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="contoh: ChIJ...">
<button id="testlink" type="button" class="btn secondary">Tes link review</button>
<p class="hint">Cari toko di &ldquo;Place ID Finder&rdquo; milik Google, salin Place ID-nya, tempel di sini. Klik &ldquo;Tes link review&rdquo; untuk memastikan tokonya benar sebelum disimpan.</p>
<label for="pw">Sandi Pengaman (min. 6 karakter)</label>
<input id="pw" type="password" maxlength="72" autocomplete="new-password">
<label for="pw2">Konfirmasi sandi</label>
<input id="pw2" type="password" maxlength="72" autocomplete="new-password">
<label class="chk"><input type="checkbox" id="showpw"> Tampilkan sandi</label>
<button id="submit" class="btn" type="submit">Aktifkan Kartu</button>
</fieldset></form>
<div id="msg" class="msg" role="alert" aria-live="polite" hidden></div>
<button id="retry" type="button" class="btn secondary" hidden>Coba lagi</button>
</main>
<script src="/config.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
